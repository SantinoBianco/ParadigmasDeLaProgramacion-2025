name: Import recovered lab sources
on:
  push:
    paths:
      - 'import-payload/labs.tar.xz.b64'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'SantinoBianco/ParadigmasDeLaProgramacion-2025'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and unpack archive
        run: |
          set -euo pipefail
          test -f import-payload/labs.tar.xz.b64
          base64 -d import-payload/labs.tar.xz.b64 | tar -tJf - >/dev/null
          git rm -f --cached -- paradigmas25-g10-lab1 paradigmas25-g10-lab2 paradigmas25-g10-lab3
          rm -rf paradigmas25-g10-lab1 paradigmas25-g10-lab2 paradigmas25-g10-lab3
          base64 -d import-payload/labs.tar.xz.b64 | tar -xJf -
          git add -- paradigmas25-g10-lab1 paradigmas25-g10-lab2 paradigmas25-g10-lab3
          git rm -- import-payload/labs.tar.xz.b64 .github/workflows/import-labs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat: publish complete source for three programming paradigms labs"
          git push origin HEAD:main
